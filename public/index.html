<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHAYA QUIZ BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#0b0f14;color:#fff}
.top{padding:14px;text-align:center;background:linear-gradient(135deg,#0b3d91,#00a651)}
.card{background:#161d27;border-radius:16px;margin:12px;padding:14px}
.bigbtn{width:100%;padding:14px;border:0;border-radius:12px;background:#FFD700;color:#000;font-weight:900;font-size:16px;cursor:pointer;margin:6px 0}
.btn2{background:#00a651;color:#fff} .btn3{background:#ff5722;color:#fff} .btn4{background:#2196f3;color:#fff}
.wallets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px} .w{background:#0b0f14;border-radius:12px;padding:10px;text-align:center} .w b{font-size:20px}
.q{font-size:18px;font-weight:800;margin:12px 0} .opt{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;text-align:left;cursor:pointer}
.opt.correct{background:#00a651} .opt.wrong{background:#e53935}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0b0f14;color:#fff;margin:6px 0}
.small{font-size:12px;color:#aaa} .hidden{display:none}
</style></head>
<body>
<div class="top"><h1>🧠 SHAYA QUIZ BOT</h1><div class="small" id="userLine">Loading...</div></div>
<div id="loginCard" class="card" style="display:none">
<h3>👋 Welcome — No Telegram Needed!</h3>
<p class="small">Enter your name. This device will remember you.</p>
<input id="nameInput" placeholder="Your name, e.g. Thabo" />
<button class="bigbtn" onclick="saveWebsiteUser()">START EARNING →</button>
</div>
<div class="card">
<div class="wallets">
<div class="w">🎁 DAILY<br><b id="dailyBal">0</b></div>
<div class="w">🎮 PLAY<br><b id="playBal">0</b></div>
<div class="w">🏆 WIN<br><b id="winBal">0</b><br><span class="small" id="winRand">R0.00</span></div>
</div>
<button class="bigbtn btn2" onclick="claimDaily()">🎁 CLAIM 200 DAILY FREE</button>
<div class="small" id="claimMsg"></div></div>
<div class="card">
<button class="bigbtn" id="startBtn" onclick="startQuizAuto()">🧠 START QUIZ</button>
<div id="quizArea" class="hidden">
<div style="display:flex;justify-content:space-between"><span id="roundLabel">Round 1</span><span id="timerLabel">⏱️ 15s</span></div>
<div class="q" id="qText"></div><div id="opts"></div><div id="feedback"></div>
<div class="small" id="progressLabel"></div>
</div>
<div id="roundEnd" class="hidden"><h3 id="roundResult"></h3><button class="bigbtn" onclick="startQuizAuto()">🧠 START NEXT ROUND</button></div>
</div>
<div class="card"><h3>💸 WITHDRAW - WIN ONLY</h3>
<select id="wMethod" onchange="updateWithdraw()"><option>Capitec</option><option>Airtime</option><option>Data - R5 = 1GB TikTok 24h</option></select>
<input id="wAmount" type="number" value="20" oninput="updateWithdraw()">
<input id="wWallet" placeholder="Capitec / Phone">
<div class="small" id="wInfo"></div>
<button class="bigbtn btn3" onclick="doWithdraw()">💸 WITHDRAW</button><div class="small" id="wMsg"></div></div>
<div class="card"><h3>🏦 TOPUP - PLAY ONLY</h3><p class="small">Capitec <b>1893275807</b> • Ref: <b id="bankRef"></b></p>
<select id="tPackage"><option value="p1000">1000 PLAY = R1</option><option value="p5000">5000 PLAY = R5</option><option value="p10000">10000 PLAY = R10</option><option value="p50000">50000 PLAY = R50</option><option value="p100000">100000 PLAY = R100</option></select>
<input id="tProof" placeholder="Paste EFT Proof / Ref">
<button class="bigbtn btn4" onclick="doTopup()">🏦 SEND TOPUP PROOF</button><div class="small" id="tMsg"></div></div>
<div id="adModal" style="display:none;position:fixed;inset:0;background:#000;z-index:9999;padding:12px;text-align:center">
<h2>🎬 ADVERTISEMENT</h2><p id="adStatus" style="color:#FFD700">Ad loading...</p>
<button class="bigbtn" id="adContinueBtn" onclick="closeAdEarly()" style="display:none;background:#00ff88">✅ CONTINUE →</button>
</div>
<script>
let tmaReady=false;
window.initCdTma?.({id:'6155603'}).then(s=>{window.show=s; tmaReady=true;}).catch(e=>console.log(e));
let userId = new URLSearchParams(window.location.search).get('start') || (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || new URLSearchParams(window.location.search).get('user_id');
let deviceId = null; let userName = 'Player';
let isTelegram = !!(window.Telegram?.WebApp?.initDataUnsafe?.user?.id);
if(isTelegram){ userName = window.Telegram.WebApp.initDataUnsafe.user.first_name || 'Player'; deviceId = 'tg_' + userId; localStorage.setItem('shaya_userId', String(userId)); localStorage.setItem('shaya_userName', userName); }
else {
  deviceId = localStorage.getItem('shaya_device_id');
  if(!deviceId){ deviceId = 'web_' + Math.random().toString(36).slice(2,12); localStorage.setItem('shaya_device_id', deviceId); }
  userId = localStorage.getItem('shaya_userId') || deviceId;
  userName = localStorage.getItem('shaya_userName') || '';
  if(!userName){ document.addEventListener('DOMContentLoaded', ()=>{ document.getElementById('loginCard').style.display='block'; }); }
}
function saveWebsiteUser(){
  const name=document.getElementById('nameInput').value.trim(); if(!name){ alert('Enter your name'); return; }
  userName=name; userId=deviceId;
  localStorage.setItem('shaya_userId', userId); localStorage.setItem('shaya_userName', userName); localStorage.setItem('shaya_device_id', deviceId);
  document.getElementById('loginCard').style.display='none';
  document.getElementById('bankRef').textContent=userName+' - '+userId;
  loadUser();
}
if(userId) document.getElementById('bankRef').textContent=userName+' - '+userId;
if(window.Telegram?.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
const DAILY=200, QUESTION_TIME=15, FEEDBACK_TIME=2000;
let dailyPoints=0, playPoints=0, points=0, qIndex=0, correct=0, wrong=0, qInRound=0, currentQ=null, timer=null, timeLeft=15, playing=false, lastClaim='';
let inAd=false, serverReady=false, adShowing=false, adClosed=false, answered=false, entryAdDone=false;
let user=null;
function saveToPhone(){ if(!userId) return; try{ localStorage.setItem('shaya_backup_'+userId, JSON.stringify({points, playPoints, dailyPoints, qIndex, correct, wrong})); }catch(e){} }
function getPhoneBackup(){ try{ return JSON.parse(localStorage.getItem('shaya_backup_'+userId)); }catch(e){ return null; } }
function save(){ if(!serverReady) return; updateUI(); saveToPhone();
  fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId, name:userName, points, playPoints, dailyPoints, qIndex, correct, wrong})}).catch(()=>{});
}
function updateUI(){
  document.getElementById('dailyBal').innerText=dailyPoints; document.getElementById('playBal').innerText=playPoints; document.getElementById('winBal').innerText=points;
  document.getElementById('winRand').innerText='R'+(points/1000).toFixed(2);
  document.getElementById('userLine').innerText=userName+' • ID: '+userId+' • Synced ✅';
  document.getElementById('progressLabel').innerText=`Q ${qInRound+1}/5 • Correct ${correct} • Wrong ${wrong}`;
  if(userId) document.getElementById('bankRef').textContent=userName+' - '+userId;
}
// FIXED: MAX MERGE - server can NEVER lower your points on reload
async function loadUser(){
  if(!userId) return;
  const backup = getPhoneBackup();
  if(backup){
    dailyPoints = backup.dailyPoints||0; playPoints = backup.playPoints||0; points = backup.points||0;
    qIndex = backup.qIndex||0; correct = backup.correct||0; wrong = backup.wrong||0;
    updateUI();
  }
  try{
    const res = await fetch('/api/user/'+encodeURIComponent(userId));
    user = await res.json(); if(user.error) throw new Error(user.error);
    let serverPoints = user.points||0; let serverPlay = user.playPoints||0; let serverDaily = user.dailyPoints||0;
    let needsPushBack = (serverPoints < points) || (serverPlay < playPoints) || (serverDaily < dailyPoints);
    dailyPoints = Math.max(dailyPoints, serverDaily);
    playPoints = Math.max(playPoints, serverPlay);
    points = Math.max(points, serverPoints);
    qIndex = Math.max(qIndex, user.qIndex||0);
    correct = Math.max(correct, user.correct||0);
    wrong = Math.max(wrong, user.wrong||0);
    updateUI(); saveToPhone();
    if(needsPushBack){
      fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId, name:userName, points, playPoints, dailyPoints, qIndex, correct, wrong})}).catch(()=>{});
    }
  }catch(e){ console.log('loadUser failed, keeping phone backup', e); }
  serverReady = true; updateUI();
}
setInterval(()=>{ if(!playing && serverReady && document.visibilityState==='visible') loadUser(); }, 10000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !playing) loadUser(); });
function claimDaily(){ const today=new Date().toDateString(); if(lastClaim===today){ document.getElementById('claimMsg').innerText='✅ Already claimed today.'; return; } dailyPoints+=DAILY; lastClaim=today; save(); document.getElementById('claimMsg').innerText='✅ +'+DAILY+' Daily claimed!'; }
function makeQ(i){
  const bank=[
    {q:'What is the capital of South Africa?',a:['Cape Town','Pretoria','Durban','Johannesburg'],c:1},
    {q:'Which province is Mbombela in?',a:['Limpopo','Mpumalanga','Gauteng','KZN'],c:1},
    {q:'What is 15 + 27?',a:['40','41','42','43'],c:2},
    {q:'Which animal is in Kruger National Park?',a:['Lion','Penguin','Polar Bear','Kangaroo'],c:0},
    {q:'What is the currency of South Africa?',a:['Dollar','Euro','Rand','Pula'],c:2},
    {q:'How many seconds in 1 minute?',a:['30','60','90','120'],c:1},
    {q:'Which is the largest ocean?',a:['Atlantic','Indian','Pacific','Arctic'],c:2},
    {q:'What is 9 x 8?',a:['70','71','72','73'],c:2},
    {q:'Which city is the Mother City?',a:['Durban','Cape Town','Pretoria','Polokwane'],c:1},
    {q:'What colour do you get mixing blue + yellow?',a:['Purple','Green','Orange','Pink'],c:1}
  ];
  let b=bank[i%bank.length]; let shift=i%4; let opts=[...b.a]; for(let k=0;k<shift;k++){opts.push(opts.shift());}
  return {q:`Q${i+1}: ${b.q}`, opts, correct:(b.c-shift+4)%4};
}
function hasPoints(){ return points>0||playPoints>0||dailyPoints>0; }
function spendOnWin(){ if(playPoints>=10) playPoints-=10; else if(dailyPoints>=10) dailyPoints-=10; }
function spendOnLose(){ if(points>=10) points-=10; else if(playPoints>=10) playPoints-=10; else if(dailyPoints>=10) dailyPoints-=10; }
function stopTimer(){ clearInterval(timer); timer=null; }
function startQuizAuto(){
  if(playing) return; if(!hasPoints()){ alert('No points left. Claim Daily 200 or Topup Play.'); return; }
  playing=true; qInRound=0; correct=0; wrong=0; entryAdDone=false;
  document.getElementById('roundEnd').classList.add('hidden'); document.getElementById('quizArea').classList.remove('hidden'); document.getElementById('startBtn').classList.add('hidden');
  showEntryAd();
}
function showQuestionAuto(){
  if(qInRound>=5){ endRound(); return; }
  inAd=false; adShowing=false; adClosed=false; answered=false;
  currentQ=makeQ(qIndex);
  document.getElementById('roundLabel').innerText='Round Question '+(qInRound+1)+'/5';
  document.getElementById('qText').innerText=currentQ.q;
  const optsDiv=document.getElementById('opts'); optsDiv.innerHTML=''; document.getElementById('feedback').innerHTML='';
  currentQ.opts.forEach((o,idx)=>{ let b=document.createElement('button'); b.className='opt'; b.innerText=o; b.onclick=()=>answerAuto(idx,b); optsDiv.appendChild(b); });
  stopTimer(); timeLeft=QUESTION_TIME; document.getElementById('timerLabel').innerText='⏱️ '+QUESTION_TIME+'s';
  timer=setInterval(()=>{ if(inAd) return; timeLeft--; document.getElementById('timerLabel').innerText='⏱️ '+timeLeft+'s'; if(timeLeft<=0){ stopTimer(); timeoutAnswer(); } },1000);
  updateUI();
}
function answerAuto(idx, btn){
  if(answered) return; answered=true; stopTimer();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  if(idx===currentQ.correct){ points+=10; correct++; spendOnWin(); document.getElementById('feedback').innerHTML='✅ CORRECT! +10 WIN'; btn.classList.add('correct'); }
  else { wrong++; spendOnLose(); document.getElementById('feedback').innerHTML='❌ WRONG! Correct: '+currentQ.opts[currentQ.correct]; btn.classList.add('wrong'); }
  qIndex++; save(); setTimeout(()=>{ showAdAuto(); },FEEDBACK_TIME);
}
function timeoutAnswer(){
  if(answered) return; answered=true; stopTimer();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  wrong++; spendOnLose(); document.getElementById('feedback').innerHTML='⏱️ TIME OUT! Correct: '+currentQ.opts[currentQ.correct];
  qIndex++; save(); setTimeout(()=>{ showAdAuto(); },FEEDBACK_TIME);
}
function endRound(){ playing=false; stopTimer(); document.getElementById('quizArea').classList.add('hidden'); document.getElementById('roundEnd').classList.remove('hidden'); document.getElementById('roundResult').innerText=`Round Done! Correct: ${correct} • Wrong: ${wrong} • WIN: ${points}`; save(); }
let adTimer=null;
function showEntryAd(){ if(entryAdDone){ showQuestionAuto(); return; } showAdOnce(()=>{ entryAdDone=true; showQuestionAuto(); }); }
function showAdAuto(){ showAdOnce(()=>{ qInRound++; save(); if(qInRound>=5) endRound(); else showQuestionAuto(); }); }
function showAdOnce(onClose){
  if(adShowing) return; adShowing=true; adClosed=false; inAd=true; stopTimer(); window._adOnClose=onClose;
  document.getElementById('adModal').style.display='block'; document.getElementById('adStatus').innerText='Ad loading... Continue appears in 3 sec.'; document.getElementById('adContinueBtn').style.display='none';
  try{ if(window.show && tmaReady){ window.show().then(()=>{ closeAdAndNext(); }).catch(e=>console.log(e)); } }catch(e){ console.log(e); }
  clearTimeout(adTimer); adTimer=setTimeout(()=>{ if(adClosed) return; document.getElementById('adStatus').innerText='Thanks! Tap Continue.'; document.getElementById('adContinueBtn').style.display='block'; },3000);
  clearTimeout(window._adAutoNext); window._adAutoNext=setTimeout(()=>{ closeAdAndNext(); },8000);
}
function closeAdEarly(){ closeAdAndNext(); }
function closeAdAndNext(){ if(adClosed) return; adClosed=true; adShowing=false; inAd=false; clearTimeout(adTimer); clearTimeout(window._adAutoNext); document.getElementById('adModal').style.display='none'; const cb=window._adOnClose; window._adOnClose=null; if(cb) cb(); }
function updateWithdraw(){ const m=document.getElementById('wMethod').value; const amt=parseFloat(document.getElementById('wAmount').value)||0; document.getElementById('wInfo').innerText = m.includes('Data') ? 'Data: R5 = 5,000 WIN = 1GB TikTok 24h' : `You will use ${amt*1000} WIN for R${amt}`; }
async function doWithdraw(){
  const method=document.getElementById('wMethod').value; const wallet=document.getElementById('wWallet').value.trim();
  let rand=parseFloat(document.getElementById('wAmount').value)||0; let pts=0;
  if(method.includes('Data')){ rand=5; pts=5000; } else { if(rand<20||rand>100){ document.getElementById('wMsg').innerText='❌ R20 - R100 only'; return; } pts=rand*1000; }
  if(!wallet){ document.getElementById('wMsg').innerText='❌ Enter Capitec / Phone'; return; }
  if(points<pts){ document.getElementById('wMsg').innerText='❌ Not enough WIN. You have '+points; return; }
  const r=await fetch('/api/quiz-withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId, name:userName, method, wallet, rand, points:pts})});
  const d=await r.json(); if(d.error){ document.getElementById('wMsg').innerText='❌ '+d.error; return; }
  points=d.remaining!==undefined?d.remaining:points-pts; save(); document.getElementById('wMsg').innerText='✅ Withdraw sent! '+pts+' WIN = R'+rand;
}
async function doTopup(){
  const pkgId=document.getElementById('tPackage').value;
  const pkgMap={p1000:{points:1000,price:1},p5000:{points:5000,price:5},p10000:{points:10000,price:10},p50000:{points:50000,price:50},p100000:{points:100000,price:100}};
  const pkg=pkgMap[pkgId]; const proof=document.getElementById('tProof').value.trim();
  if(!proof){ document.getElementById('tMsg').innerText='❌ Paste EFT Proof first'; return; }
  const r=await fetch('/api/quiz-topup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId, name:userName, packageId:pkgId, points:pkg.points, price:pkg.price, proof})});
  const d=await r.json(); document.getElementById('tMsg').innerText='✅ '+d.msg;
}
loadUser(); updateWithdraw();
</script>
</body></html>
